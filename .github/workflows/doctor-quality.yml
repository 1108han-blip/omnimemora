name: Doctor Quality

on:
  pull_request:
    paths:
      - ".github/workflows/doctor-quality.yml"
      - "Makefile"
      - "tools/doctor_quality.py"
      - "5_connectors/adapter/application/token_intelligence/**"
      - "5_connectors/adapter/tests/test_doctor_quality.py"
      - "6_console/**"
      - "7_docs/internal/doctor_quality/**"
      - "7_docs/internal/token_intelligence/**"
      - "README.md"
      - "AGENTS.md"
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/doctor-quality.yml"
      - "Makefile"
      - "tools/doctor_quality.py"
      - "5_connectors/adapter/application/token_intelligence/**"
      - "5_connectors/adapter/tests/test_doctor_quality.py"
      - "6_console/**"
      - "7_docs/internal/doctor_quality/**"
      - "7_docs/internal/token_intelligence/**"
      - "README.md"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor-quality-report:
    name: Doctor quality report
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Generate doctor JSON evidence
        id: doctor_json
        continue-on-error: true
        run: make doctor-json > doctor-quality.json

      - name: Add doctor summary
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path("doctor-quality.json")
          out = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not summary_path.exists():
              out.write_text("## Doctor Quality\n\nDoctor JSON evidence was not produced.\n", encoding="utf-8")
              raise SystemExit(0)

          payload = json.loads(summary_path.read_text(encoding="utf-8"))
          summary = payload.get("summary", {})
          lines = [
              "## Doctor Quality",
              "",
              f"- mode: `{payload.get('mode', 'unknown')}`",
              f"- static checks: `{summary.get('static_passed', 0)}/{summary.get('static_total', 0)}`",
              f"- static errors: `{summary.get('static_errors', 0)}`",
              f"- static warnings: `{summary.get('static_warnings', 0)}`",
              "",
              "This workflow is report-only. It does not define a merge-blocking gate.",
              "",
          ]
          out.write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Run text doctor report
        continue-on-error: true
        run: make doctor

      - name: Compile doctor test files
        continue-on-error: true
        run: python -m py_compile tools/doctor_quality.py 5_connectors/adapter/tests/test_doctor_quality.py

      - name: Run doctor unit tests
        continue-on-error: true
        run: PYTHONPATH=. python -m pytest -q 5_connectors/adapter/tests/test_doctor_quality.py

      - name: Upload doctor JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-quality-json
          path: doctor-quality.json
          if-no-files-found: ignore

  react-doctor-report:
    name: ReactDoctor report
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      REACT_DOCTOR_PACKAGE: react-doctor@0.1.6

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate ReactDoctor JSON evidence
        id: react_doctor_json
        continue-on-error: true
        run: python tools/doctor_quality.py --json --react-doctor --react-timeout 180 > doctor-quality-react.json

      - name: Generate readable doctor brief
        if: always()
        continue-on-error: true
        run: python tools/doctor_brief.py --react-json doctor-quality-react.json > doctor-brief.md

      - name: Add ReactDoctor summary
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path("doctor-quality-react.json")
          out = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not summary_path.exists():
              out.write_text("## ReactDoctor\n\nReactDoctor JSON evidence was not produced.\n", encoding="utf-8")
              raise SystemExit(0)

          payload = json.loads(summary_path.read_text(encoding="utf-8"))
          results = payload.get("react_doctor", [])
          lines = [
              "## ReactDoctor",
              "",
              f"- package: `{os.environ.get('REACT_DOCTOR_PACKAGE', 'unknown')}`",
              f"- completed packages: `{payload.get('summary', {}).get('react_doctor_completed', 0)}/{len(results)}`",
              "",
              "| path | status | version | score | diagnostics |",
              "|---|---:|---:|---:|---:|",
          ]
          for result in results:
              lines.append(
                  "| {path} | {status} | {version} | {score} | {diagnostics} |".format(
                      path=result.get("path", ""),
                      status=result.get("status", ""),
                      version=result.get("version", ""),
                      score=result.get("score", ""),
                      diagnostics=result.get("diagnostic_count", ""),
                  )
              )
          lines.extend(
              [
                  "",
                  "This workflow is report-only. ReactDoctor findings do not define a merge-blocking gate.",
                  "",
              ]
          )
          out.write_text("\n".join(lines), encoding="utf-8")
          PY
          if [ -f doctor-brief.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat doctor-brief.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run text ReactDoctor report
        continue-on-error: true
        run: make doctor-react

      - name: Upload ReactDoctor JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-quality-react-json
          path: doctor-quality-react.json
          if-no-files-found: ignore

      - name: Upload readable doctor brief
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-brief
          path: doctor-brief.md
          if-no-files-found: ignore
